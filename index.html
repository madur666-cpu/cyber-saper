<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Сапёр 3D</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0A0A1A;
  color: #fff;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
body {
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  margin: 6px 10px 4px;
  background: rgba(15,20,40,0.75);
  border: 1px solid rgba(0,240,255,0.15);
  border-radius: 12px;
  flex-shrink: 0;
}
.header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(0,240,255,0.3);
  color: #fff;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
}

/* Stats */
.stats-row {
  display: flex; gap: 6px;
  padding: 0 10px; margin-bottom: 4px;
  flex-shrink: 0;
}
.stat-box {
  flex: 1;
  background: rgba(15,20,40,0.75);
  border: 1px solid rgba(0,240,255,0.1);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
}
.stat-label { font-size: 10px; color: #8899AA; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 18px; font-weight: 700; margin-top: 2px; }

/* Board */
.board-wrap {
  flex: 1;
  margin: 4px 10px;
  padding: 6px;
  background: rgba(15,20,40,0.6);
  border: 1px solid rgba(0,240,255,0.12);
  border-radius: 12px;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  -webkit-overflow-scrolling: touch;
}
#board {
  display: grid;
  gap: 3px;
  margin: auto;
}
.cell {
  min-width: 44px;
  min-height: 44px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  position: relative;
  transition: transform 0.08s, background 0.2s;
  touch-action: manipulation;
}
.cell:active { transform: scale(0.88); }
.cell.closed {
  background: #3C4664;
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 4px rgba(0,0,0,0.3);
}
.cell.revealed {
  background: #142037;
  border: 1px solid rgba(0,240,255,0.25);
  box-shadow: inset 0 0 8px rgba(0,240,255,0.08);
}
.cell.mine {
  background: rgba(255,0,64,0.25);
  border: 2px solid #FF0040;
  animation: explodePulse 0.4s ease;
}
.cell.flagged::after { content: "🚩"; font-size: 20px; }
.cell.scanner-hl {
  animation: scannerPulse 1.2s ease-in-out infinite;
}
@keyframes scannerPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(0,240,255,0.4); }
  50% { box-shadow: 0 0 12px 3px rgba(0,240,255,0.2); }
}
@keyframes explodePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Number colors */
.n1 { color: #4DF9FF; text-shadow: 0 0 6px rgba(77,249,255,0.5); }
.n2 { color: #47FFB3; text-shadow: 0 0 6px rgba(71,255,179,0.5); }
.n3 { color: #FF5C8F; text-shadow: 0 0 6px rgba(255,92,143,0.5); }
.n4 { color: #FF85FF; text-shadow: 0 0 6px rgba(255,133,255,0.5); }
.n5 { color: #FFCC47; text-shadow: 0 0 6px rgba(255,204,71,0.5); }
.n6 { color: #5CDFFF; text-shadow: 0 0 6px rgba(92,223,255,0.5); }
.n7 { color: #FFFFFF; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
.n8 { color: #BBBBBB; }

/* Bottom panel */
.bottom {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  margin: 4px 10px 8px;
  background: rgba(15,20,40,0.75);
  border: 1px solid rgba(0,240,255,0.1);
  border-radius: 12px;
  gap: 8px;
  flex-shrink: 0;
}
.diff-group { display: flex; gap: 5px; }
.diff-btn {
  background: transparent;
  border: 1px solid rgba(0,240,255,0.35);
  color: #00F0FF;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}
.diff-btn.active {
  background: rgba(0,240,255,0.15);
  border-color: #00F0FF;
}
.power-group { display: flex; gap: 6px; }
.power-btn {
  background: rgba(0,240,255,0.06);
  border: 1px solid rgba(0,240,255,0.3);
  color: #fff;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.power-btn.shield-btn {
  background: rgba(255,0,255,0.06);
  border-color: rgba(255,0,255,0.35);
}
.power-btn.flag-mode-btn {
  background: rgba(255,204,71,0.08);
  border-color: rgba(255,204,71,0.4);
  color: #FFCC47;
}
.power-btn.flag-mode-btn.active {
  background: rgba(255,204,71,0.25);
  box-shadow: 0 0 10px rgba(255,204,71,0.3);
}
.power-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.power-btn.active-mode {
  box-shadow: 0 0 10px currentColor;
}

/* Shield overlay */
.shield-overlay {
  position: fixed; inset: 0;
  border: 3px solid rgba(255,0,255,0.4);
  pointer-events: none;
  z-index: 50;
  box-shadow: inset 0 0 30px rgba(255,0,255,0.1);
  display: none;
}
.shield-overlay.on { display: block; }

/* Result dialog */
.dialog-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.dialog-overlay.show { display: flex; }
.dialog-box {
  background: rgba(15,20,40,0.95);
  border: 1px solid rgba(0,240,255,0.3);
  border-radius: 20px;
  padding: 28px;
  text-align: center;
  max-width: 300px;
  width: 85%;
}
.dialog-title { font-size: 24px; font-weight: 700; margin-bottom: 14px; }
.dialog-stats { color: #8899AA; font-size: 14px; line-height: 1.8; margin-bottom: 18px; }
.dialog-btn {
  background: rgba(0,240,255,0.1);
  border: 1px solid #00F0FF;
  color: #fff;
  padding: 12px 28px;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15,20,40,0.95);
  border: 1px solid rgba(0,240,255,0.3);
  color: #00F0FF;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 200;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Scrollbar */
.board-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
.board-wrap::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.3); border-radius: 4px; }

/* Install prompt */
.install-banner {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15,20,40,0.95);
  border-top: 1px solid rgba(0,240,255,0.3);
  padding: 10px 14px;
  display: none; align-items: center; justify-content: space-between;
  z-index: 300;
}
.install-banner.show { display: flex; }
.install-text { font-size: 13px; }
.install-btn {
  background: #00F0FF;
  color: #0A0A1A;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.install-close {
  background: none; border: none; color: #8899AA;
  font-size: 18px; margin-left: 8px; cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">💎 САПЁР 3D</div>
  <button class="btn" id="btnRestart">Рестарт</button>
</div>

<div class="stats-row">
  <div class="stat-box">
    <div class="stat-label">⏱ Время</div>
    <div class="stat-value" id="tvTime" style="color:#00F0FF">00:00</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">⭐ Очки</div>
    <div class="stat-value" id="tvScore" style="color:#FF00FF">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">🚩 Мины</div>
    <div class="stat-value" id="tvMines" style="color:#FF2A6D">10</div>
  </div>
</div>

<div class="board-wrap">
  <div id="board"></div>
</div>

<div class="bottom">
  <div class="diff-group">
    <button class="diff-btn" data-diff="easy">Легко</button>
    <button class="diff-btn active" data-diff="medium">Средне</button>
    <button class="diff-btn" data-diff="hard">Сложно</button>
  </div>
  <div class="power-group">
    <button class="power-btn flag-mode-btn" id="btnFlagMode">🚩 Выкл</button>
    <button class="power-btn" id="btnScanner">📡 x3</button>
    <button class="power-btn shield-btn" id="btnShield">🛡 x1</button>
  </div>
</div>

<div class="shield-overlay" id="shieldOverlay"></div>

<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog-box">
    <div class="dialog-title" id="dialogTitle">ПОБЕДА!</div>
    <div class="dialog-stats" id="dialogStats"></div>
    <button class="dialog-btn" id="btnPlayAgain">Играть снова</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="install-banner" id="installBanner">
  <span class="install-text">📲 Установи Сапёр на главный экран!</span>
  <div>
    <button class="install-btn" id="btnInstall">Установить</button>
    <button class="install-close" id="btnInstallClose">×</button>
  </div>
</div>

<script>
// ===================== AUDIO =====================
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playExplosion() {
  try {
    const ctx = getAudio();
    const t = ctx.currentTime;
    const bufferSize = ctx.sampleRate * 0.4;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufferSize, 3);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.5, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, t);
    filter.frequency.exponentialRampToValueAtTime(100, t + 0.3);
    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.5);

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.4, t);
    oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.5);
  } catch(e) {}
}

function playWin() {
  try {
    const ctx = getAudio();
    const t = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.12);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, t + i * 0.12);
      gain.gain.linearRampToValueAtTime(0.12, t + i * 0.12 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.4);
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2000;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.5);
    });
  } catch(e) {}
}

// ===================== GAME LOGIC =====================
const DIFFICULTIES = {
  easy:   { rows: 8,  cols: 8,  mines: 10 },
  medium: { rows: 12, cols: 12, mines: 25 },
  hard:   { rows: 16, cols: 16, mines: 45 }
};

let diff = 'medium';
let rows = 12, cols = 12, mineCount = 25;
let board = [];
let firstClick = true;
let gameState = 'playing';
let seconds = 0;
let score = 0;
let scoreCheckpoint = 0;
let scannerCount = 3;
let shieldCount = 1;
let shieldOn = false;
let timerInterval = null;
let scannerMode = false;
let flagMode = false; // NEW: flag toggle mode

const $ = id => document.getElementById(id);
const boardEl = $('board');

function initGame() {
  const d = DIFFICULTIES[diff];
  rows = d.rows; cols = d.cols; mineCount = d.mines;
  board = Array.from({length: rows}, () => Array(cols).fill(null).map(() => ({
    isMine: false, adjacent: 0, revealed: false, flagged: false
  })));
  firstClick = true;
  gameState = 'playing';
  seconds = 0;
  score = 0;
  scoreCheckpoint = 0;
  scannerCount = 3;
  shieldCount = 1;
  shieldOn = false;
  scannerMode = false;
  flagMode = false;
  clearInterval(timerInterval);
  updateUI();
  renderBoard();
  hideDialog();
  $('shieldOverlay').classList.remove('on');
}

function placeMines(excludeR, excludeC) {
  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if ((r === excludeR && c === excludeC) || board[r][c].isMine) continue;
    board[r][c].isMine = true;
    placed++;
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c].isMine) continue;
      board[r][c].adjacent = countAdj(r, c);
    }
  }
}

function countAdj(r, c) {
  let n = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) n++;
    }
  }
  return n;
}

function renderBoard() {
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(44px, 1fr))';

  const wrap = document.querySelector('.board-wrap');
  const availW = wrap.clientWidth - 12;
  const availH = wrap.clientHeight - 12;
  const cellW = Math.max(44, Math.min(52, Math.floor((availW - (cols-1)*3) / cols)));
  const cellH = Math.max(44, Math.min(52, Math.floor((availH - (rows-1)*3) / rows)));
  const cellSize = Math.min(cellW, cellH);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = board[r][c];
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.width = cellSize + 'px';
      el.style.height = cellSize + 'px';
      el.style.fontSize = Math.max(16, Math.floor(cellSize * 0.42)) + 'px';
      el.dataset.r = r;
      el.dataset.c = c;

      if (cell.revealed) {
        el.classList.add(cell.isMine ? 'mine' : 'revealed');
        if (!cell.isMine && cell.adjacent > 0) {
          el.textContent = cell.adjacent;
          el.classList.add('n' + cell.adjacent);
        }
        if (cell.isMine) el.textContent = '💣';
      } else if (cell.flagged) {
        el.classList.add('closed', 'flagged');
      } else {
        el.classList.add('closed');
      }

      // ===== UNIFIED TOUCH HANDLING =====
      let touchStartTime = 0;
      let touchMoved = false;
      let longPressTimer = null;
      let startX = 0, startY = 0;
      let longPressFired = false;

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) return;
        e.preventDefault(); // prevent scroll, context menu, selection
        touchStartTime = Date.now();
        touchMoved = false;
        longPressFired = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          onRightClick(r, c);
          if (navigator.vibrate) navigator.vibrate(50);
        }, 500);
      }, {passive: false});

      el.addEventListener('touchmove', (e) => {
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 18 || Math.abs(dy) > 18) {
          touchMoved = true;
          clearTimeout(longPressTimer);
        }
      }, {passive: true});

      el.addEventListener('touchend', (e) => {
        clearTimeout(longPressTimer);
        if (!touchMoved && !longPressFired) {
          // Short tap
          onLeftClick(r, c);
        }
      }, {passive: true});

      el.addEventListener('touchcancel', () => {
        clearTimeout(longPressTimer);
      }, {passive: true});

      // Mouse (desktop)
      el.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          e.preventDefault();
          onRightClick(r, c);
        }
      });
      el.addEventListener('click', (e) => onLeftClick(r, c));
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); });

      boardEl.appendChild(el);
    }
  }
}

function onLeftClick(r, c) {
  if (gameState !== 'playing') return;
  const cell = board[r][c];
  if (cell.revealed) return;

  getAudio();

  // Flag mode: tap toggles flag
  if (flagMode) {
    onRightClick(r, c);
    return;
  }

  if (cell.flagged) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
  }

  if (scannerMode) {
    scannerMode = false;
    $('btnScanner').classList.remove('active-mode');
    if (cell.adjacent > 0 && !cell.isMine) {
      highlightScanner(r, c);
      return;
    }
  }

  if (cell.isMine) {
    if (shieldOn) {
      shieldOn = false;
      $('shieldOverlay').classList.remove('on');
      cell.flagged = true;
      updateUI();
      renderBoard();
      showToast('Щит спас! Мина обезврежена 🛡');
      return;
    }
    gameState = 'lost';
    revealAllMines();
    stopTimer();
    renderBoard();
    playExplosion();
    showDialog(false);
    return;
  }

  reveal(r, c);
  checkWin();
  updateUI();
  renderBoard();
}

function onRightClick(r, c) {
  if (gameState !== 'playing') return;
  const cell = board[r][c];
  if (cell.revealed) return;
  cell.flagged = !cell.flagged;
  updateUI();
  renderBoard();
}

function reveal(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  const cell = board[r][c];
  if (cell.revealed || cell.flagged) return;
  cell.revealed = true;
  addScore(10);
  if (cell.adjacent === 0 && !cell.isMine) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        reveal(r + dr, c + dc);
      }
    }
  }
}

function addScore(p) {
  score += p;
  const cp = Math.floor(score / 1000);
  if (cp > scoreCheckpoint) {
    scoreCheckpoint = cp;
    scannerCount++;
    shieldCount++;
    showToast('+' + (cp * 1000) + ' очков! Сканер +1, Щит +1');
  }
}

function checkWin() {
  let revealed = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (board[r][c].revealed) revealed++;
  if (revealed === rows * cols - mineCount) {
    gameState = 'won';
    stopTimer();
    addScore(Math.max(0, 1000 - seconds * 5));
    updateUI();
    renderBoard();
    playWin();
    showDialog(true);
  }
}

function revealAllMines() {
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (board[r][c].isMine) board[r][c].revealed = true;
}

function highlightScanner(r, c) {
  const idx = r * cols + c;
  const el = boardEl.children[idx];
  if (el) {
    el.classList.add('scanner-hl');
    setTimeout(() => el.classList.remove('scanner-hl'), 3000);
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds/60)).padStart(2,'0');
    const s = String(seconds%60).padStart(2,'0');
    $('tvTime').textContent = m + ':' + s;
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

function updateUI() {
  $('tvScore').textContent = score;
  let flagged = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (board[r][c].flagged) flagged++;
  $('tvMines').textContent = mineCount - flagged;
  $('btnScanner').textContent = '📡 x' + scannerCount;
  $('btnScanner').disabled = scannerCount <= 0;
  $('btnShield').textContent = '🛡 x' + shieldCount;
  $('btnShield').disabled = shieldCount <= 0 || shieldOn;

  // Flag mode button
  const btnFlag = $('btnFlagMode');
  if (flagMode) {
    btnFlag.textContent = '🚩 Вкл';
    btnFlag.classList.add('active');
  } else {
    btnFlag.textContent = '🚩 Выкл';
    btnFlag.classList.remove('active');
  }
}

function showDialog(won) {
  $('dialogTitle').textContent = won ? 'ПОБЕДА!' : 'ИГРА ОКОНЧЕНА';
  $('dialogTitle').style.color = won ? '#00F0FF' : '#FF2A6D';
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds%60).padStart(2,'0');
  $('dialogStats').innerHTML = 'Время: ' + m + ':' + s + '<br>Очки: ' + score;
  $('dialogOverlay').classList.add('show');
}
function hideDialog() {
  $('dialogOverlay').classList.remove('show');
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Controls
$('btnRestart').addEventListener('click', () => { getAudio(); initGame(); });
$('btnPlayAgain').addEventListener('click', () => { getAudio(); initGame(); });

$('btnFlagMode').addEventListener('click', () => {
  getAudio();
  flagMode = !flagMode;
  scannerMode = false;
  $('btnScanner').classList.remove('active-mode');
  updateUI();
  showToast(flagMode ? 'Режим флажков: нажми на ячейку чтобы поставить/убрать флажок' : 'Режим открытия ячеек');
});

$('btnScanner').addEventListener('click', () => {
  getAudio();
  if (scannerCount <= 0 || firstClick || gameState !== 'playing') return;
  if (scannerMode) {
    scannerMode = false;
    $('btnScanner').classList.remove('active-mode');
  } else {
    scannerCount--;
    scannerMode = true;
    flagMode = false;
    $('btnScanner').classList.add('active-mode');
    updateUI();
    showToast('Нажми на закрытую ячейку чтобы просканировать');
  }
});

$('btnShield').addEventListener('click', () => {
  getAudio();
  if (shieldCount <= 0 || shieldOn || gameState !== 'playing') return;
  shieldCount--;
  shieldOn = true;
  $('shieldOverlay').classList.add('on');
  updateUI();
  showToast('Щит активирован! Следующая мина будет обезврежена');
});

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    getAudio();
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diff = btn.dataset.diff;
    initGame();
  });
});

// Re-render on resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderBoard, 200);
});

// ===================== PWA =====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('installBanner').classList.add('show');
});
$('btnInstall').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('installBanner').classList.remove('show');
});
$('btnInstallClose').addEventListener('click', () => {
  $('installBanner').classList.remove('show');
});

// Init
initGame();
</script>
</body>
</html>
